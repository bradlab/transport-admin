<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <title>Gestion des Clients</title>
</h:head>
<h:body>
    <h1>Gestion des Clients</h1>
    <!-- Affichage de la liste des clients -->
    <h:dataTable value="#{clientController.clients}" var="client" border="1">
        <h:column>
            <f:facet name="header">Nom</f:facet>
            #{client.nom}
        </h:column>
        <h:column>
            <f:facet name="header">Prénoms</f:facet>
            #{client.prenoms}
        </h:column>
        <h:column>
            <f:facet name="header">Téléphone</f:facet>
            #{client.telephone}
        </h:column>
        <h:column>
            <f:facet name="header">E-mail</f:facet>
            #{client.email}
        </h:column>
        <h:column>
            <f:facet name="header">Date d'enregistrement</f:facet>
            #{client.dateEnregistrement}
        </h:column>
        <h:column>
            <f:facet name="header">Adresse</f:facet>
            #{client.adresse}
        </h:column>
        <h:column>
            <f:facet name="header">Actions</f:facet>
            <ui:fragment rendered="#{facesContext.externalContext.isUserInRole('ADMIN')}">
                <h:commandButton value="Modifier" action="#{clientController.setClient(client)}"/>
                <h:commandButton value="Supprimer" action="#{clientController.deleteClient(client)}"/>
            </ui:fragment>
        </h:column>
    </h:dataTable>

    <!-- Formulaire d'ajout/édition (réservé aux admins) -->
    <ui:fragment rendered="#{facesContext.externalContext.isUserInRole('ADMIN')}">
        <h:form>
            <h:panelGrid columns="2">
                <h:outputLabel value="Nom:"/>
                <h:inputText value="#{clientController.client.nom}" required="true"/>
                <h:outputLabel value="Prénoms:"/>
                <h:inputText value="#{clientController.client.prenoms}" required="true"/>
                <h:outputLabel value="Téléphone:"/>
                <h:inputText value="#{clientController.client.telephone}" required="true"/>
                <h:outputLabel value="E-mail:"/>
                <h:inputText value="#{clientController.client.email}" required="true"/>
                <h:outputLabel value="Adresse:"/>
                <h:inputText value="#{clientController.client.adresse}"/>
            </h:panelGrid>
            <h:commandButton value="Enregistrer" action="#{clientController.createClient}"/>
            <h:commandButton value="Modifier" action="#{clientController.updateClient}"/>
        </h:form>
    </ui:fragment>
</h:body>
</html>
